name: Azure Production Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-sfml-prod
  LOCATION: eastus

jobs:
  build-and-test:
    name: Build & Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore backend/SfmlPlayground.sln

      - name: Run Backend Tests
        run: dotnet test backend/SfmlPlayground.Tests/SfmlPlayground.Tests.csproj --no-restore --verbosity normal

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to Azure
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure Resource Group
        run: |
          az group create --name "${{ env.RESOURCE_GROUP }}" --location "${{ env.LOCATION }}"

      - name: Deploy Infrastructure (Bicep)
        id: bicep
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: ./deploy/azure/main.bicep
          parameters: >-
            vmAdminUsername="sfmladmin"
            vmAuthType="sshPublicKey"
            vmAdminPasswordOrKey="${{ secrets.VM_SSH_PUBLIC_KEY }}"
            sqlAdminUsername="sfmlsqladmin"
            sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}"

      - name: Log in to Azure Container Registry
        run: |
          ACR_NAME="${{ steps.bicep.outputs.acrName }}"
          az acr login --name "$ACR_NAME"

      - name: Build and Push SFML Sandbox Image
        run: |
          ACR_LOGIN_SERVER="${{ steps.bicep.outputs.acrLoginServer }}"
          docker build -t "$ACR_LOGIN_SERVER/sfml-sandbox:2.6.2" -t "$ACR_LOGIN_SERVER/sfml-sandbox:latest" -f runner/Dockerfile runner
          docker push "$ACR_LOGIN_SERVER/sfml-sandbox:2.6.2"
          docker push "$ACR_LOGIN_SERVER/sfml-sandbox:latest"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply Azure SQL Database Migrations
        run: |
          SQL_SERVER="${{ steps.bicep.outputs.sqlServerFqdn }}"
          SQL_DB="${{ steps.bicep.outputs.sqlDatabaseName }}"
          SQL_CONN="Server=tcp:$SQL_SERVER,1433;Initial Catalog=$SQL_DB;Persist Security Info=False;User ID=sfmlsqladmin;Password=${{ secrets.SQL_ADMIN_PASSWORD }};MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"
          
          # Add GitHub runner IP to SQL firewall temporarily
          RUNNER_IP=$(curl -s https://api.ipify.org)
          SQL_SERVER_NAME=$(echo "$SQL_SERVER" | cut -d'.' -f1)
          az sql server firewall-rule create --resource-group "${{ env.RESOURCE_GROUP }}" --server "$SQL_SERVER_NAME" --name "GitHubRunnerRule" --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP"
          
          dotnet tool install --global dotnet-ef || true
          ConnectionStrings__DefaultConnection="$SQL_CONN" dotnet ef database update --project backend/SfmlPlayground.Api
          
          az sql server firewall-rule delete --resource-group "${{ env.RESOURCE_GROUP }}" --server "$SQL_SERVER_NAME" --name "GitHubRunnerRule" || true

      - name: Publish Backend Binaries
        run: |
          dotnet publish backend/SfmlPlayground.Api/SfmlPlayground.Api.csproj -c Release -o ./dist/backend

      - name: Build Frontend Bundle
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Package Deployment Artifact
        run: |
          mkdir -p ./deploy-pkg
          cp -r ./dist/backend ./deploy-pkg/backend
          cp -r ./frontend/dist/frontend/browser ./deploy-pkg/frontend
          tar -czf ./deploy-package.tar.gz -C ./deploy-pkg .

      - name: Deploy to Azure VM
        run: |
          VM_IP="${{ steps.bicep.outputs.vmPublicIp }}"
          echo "Deploying to VM at $VM_IP..."

          # Retrieve Storage Connection String
          STORAGE_ACCOUNT="${{ steps.bicep.outputs.storageAccountName }}"
          STORAGE_CONN=$(az storage account show-connection-string --name "$STORAGE_ACCOUNT" --resource-group "${{ env.RESOURCE_GROUP }}" --query connectionString -o tsv)

          SQL_SERVER="${{ steps.bicep.outputs.sqlServerFqdn }}"
          SQL_DB="${{ steps.bicep.outputs.sqlDatabaseName }}"
          SQL_CONN="Server=tcp:$SQL_SERVER,1433;Initial Catalog=$SQL_DB;Persist Security Info=False;User ID=sfmlsqladmin;Password=${{ secrets.SQL_ADMIN_PASSWORD }};MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"

          # Configure app.env on the VM via az vm run-command
          az vm run-command invoke \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "sfml-vm-prod" \
            --command-id RunShellScript \
            --scripts "
              cat << 'EOF' > /var/sfml/backend/app.env
              ConnectionStrings__DefaultConnection=$SQL_CONN
              AzureStorage__ConnectionString=$STORAGE_CONN
              AzureStorage__ContainerName=sfml-assets
              Storage__LspPath=/var/sfml/storage/lsp-workspaces
              EOF
              chmod 600 /var/sfml/backend/app.env
              chown sfmladmin:sfmladmin /var/sfml/backend/app.env
            "

      - name: Health Check
        run: |
          VM_IP="${{ steps.bicep.outputs.vmPublicIp }}"
          echo "Checking VM Health at http://$VM_IP/health..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://$VM_IP/health" || echo "000")
            if [ "$STATUS" == "200" ]; then
              echo "SFML Platform is HEALTHY!"
              exit 0
            fi
            echo "Waiting for service to be healthy... ($i/30, status=$STATUS)"
            sleep 5
          done
          echo "Health check timed out."
          exit 1
