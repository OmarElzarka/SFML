<!-- SFML Playground — Main Layout -->
<div class="playground">
  <!-- ─── Header ─────────────────────────────────────────────────────── -->
  <header class="toolbar">
    <div class="toolbar-brand">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="18" height="18" rx="3" stroke="url(#grad)" stroke-width="2"/>
          <circle cx="12" cy="12" r="4" fill="url(#grad)"/>
          <defs>
            <linearGradient id="grad" x1="3" y1="3" x2="21" y2="21">
              <stop stop-color="#58a6ff"/>
              <stop offset="1" stop-color="#bc8cff"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1 class="brand-title">SFML Playground</h1>
      <span class="brand-badge">2.6.2</span>
    </div>

    <div class="toolbar-center">
      <div class="status-indicator" [class]="statusClass">
        <span class="status-dot"></span>
        <span class="status-text">{{ statusText }}</span>
      </div>
    </div>

    <div class="toolbar-actions">
      <button
        id="btn-run"
        class="btn btn-run"
        (click)="run()"
        [disabled]="isLoading || isRunning"
        title="Run (Ctrl+Enter)"
      >
        <svg class="btn-icon" viewBox="0 0 16 16" fill="currentColor">
          <path d="M4 2l10 6-10 6V2z"/>
        </svg>
        <span>Run</span>
      </button>
      <button
        id="btn-stop"
        class="btn btn-stop"
        (click)="stop()"
        [disabled]="!isRunning && !isLoading"
        title="Stop"
      >
        <svg class="btn-icon" viewBox="0 0 16 16" fill="currentColor">
          <rect x="3" y="3" width="10" height="10" rx="1"/>
        </svg>
        <span>Stop</span>
      </button>
    </div>
  </header>

  <!-- ─── Main Content ───────────────────────────────────────────────── -->
  <main class="content">
    <!-- ─── Code Editor Panel ──────────────────────────────────────── -->
    <section class="panel panel-editor">
      <div class="panel-header">
        <div class="panel-tab active">
          <svg class="tab-icon" viewBox="0 0 16 16" fill="currentColor" width="14" height="14">
            <path d="M5.854 4.854a.5.5 0 10-.708-.708l-3.5 3.5a.5.5 0 000 .708l3.5 3.5a.5.5 0 00.708-.708L2.707 8l3.147-3.146zm4.292 0a.5.5 0 01.708-.708l3.5 3.5a.5.5 0 010 .708l-3.5 3.5a.5.5 0 01-.708-.708L13.293 8l-3.147-3.146z"/>
          </svg>
          <span>main.cpp</span>
        </div>
        <div class="panel-hint">Ctrl+Enter to Run</div>
      </div>
      <div class="editor-wrapper" #editorContainer id="editor-container"></div>
    </section>

    <!-- ─── SFML Viewport Panel ────────────────────────────────────── -->
    <section class="panel panel-viewport">
      <div class="panel-header">
        <div class="panel-tab active">
          <svg class="tab-icon" viewBox="0 0 16 16" fill="currentColor" width="14" height="14">
            <path d="M0 3.5A1.5 1.5 0 011.5 2h13A1.5 1.5 0 0116 3.5v9a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 010 12.5v-9zM1.5 3a.5.5 0 00-.5.5v9a.5.5 0 00.5.5h13a.5.5 0 00.5-.5v-9a.5.5 0 00-.5-.5h-13z"/>
          </svg>
          <span>Output</span>
        </div>
      </div>
      <div class="viewport-wrapper" id="viewport-wrapper" (click)="focusIframe()">
        <!-- VNC display -->
        <iframe
          *ngIf="safeVncUrl"
          #vncFrame
          id="vnc-frame"
          [src]="safeVncUrl"
          class="vnc-iframe"
          allow="keyboard-map; fullscreen"
        ></iframe>

        <!-- Placeholder when not running -->
        <div class="viewport-placeholder" *ngIf="!safeVncUrl" id="viewport-placeholder">
          <div class="placeholder-content">
            <div class="placeholder-icon">
              <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                <rect x="8" y="8" width="48" height="48" rx="8" stroke="var(--border-primary)" stroke-width="2" stroke-dasharray="4 4"/>
                <path d="M24 22l16 10-16 10V22z" fill="var(--text-tertiary)"/>
              </svg>
            </div>
            <p class="placeholder-text">Run your code to start</p>
            <p class="placeholder-subtext">Your SFML application will appear here</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ─── Terminal Panel ─────────────────────────────────────────────── -->
  <footer class="panel panel-terminal">
    <div class="panel-header">
      <div class="panel-tab active">
        <svg class="tab-icon" viewBox="0 0 16 16" fill="currentColor" width="14" height="14">
          <path d="M6 9a.5.5 0 01.5-.5h3a.5.5 0 010 1h-3A.5.5 0 016 9zM3.854 4.146a.5.5 0 10-.708.708L5.293 7 3.146 9.146a.5.5 0 10.708.708l2.5-2.5a.5.5 0 000-.708l-2.5-2.5z"/>
          <path d="M2 1a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V3a2 2 0 00-2-2H2zm12 1a1 1 0 011 1v10a1 1 0 01-1 1H2a1 1 0 01-1-1V3a1 1 0 011-1h12z"/>
        </svg>
        <span>Terminal</span>
      </div>
    </div>
    <div class="terminal-content" id="terminal-content">
      <pre class="terminal-output" *ngIf="terminalOutput" id="terminal-output">{{ terminalOutput }}</pre>
      <div class="terminal-empty" *ngIf="!terminalOutput" id="terminal-empty">
        <span class="terminal-prompt">$</span>
        <span class="terminal-cursor"></span>
      </div>
    </div>
  </footer>
</div>
