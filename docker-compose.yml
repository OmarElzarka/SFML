services:
  # ─── ASP.NET Core Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend/SfmlPlayground.Api
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - Docker__Host=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - sandbox-image
    networks:
      - playground-net

  # ─── Angular Frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - playground-net

  # ─── Persistent SFML Runtime Container ─────────────────────────────────
  sfml-runtime:
    image: sfml-sandbox:latest
    build:
      context: ./runner
      dockerfile: Dockerfile
    container_name: sfml-runtime
    restart: unless-stopped
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - ./backend/SfmlPlayground.Api/storage/workspace:/workspace
    environment:
      - DISPLAY=:99
    networks:
      - playground-net

networks:
  playground-net:
    driver: bridge
